name: messenger-local
services:
  synapse:
    image: matrixdotorg/synapse:v1.165.0
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: messenger.localhost
      SYNAPSE_REPORT_STATS: "no"
    ports:
      - "127.0.0.1:18008:8008"
    volumes:
      - ./runtime/synapse:/data
      - ./runtime/meta/registration.yaml:/bridge/registration.yaml:ro
    networks: [local]
  meta:
    image: dock.mau.dev/mautrix/meta:v26.10
    command: ["/usr/bin/mautrix-meta", "--no-update", "-c", "/data/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./runtime/meta:/data
    networks: [local]
networks:
  local:
